services:
  postgres_db:
    image: postgres:16-alpine
    container_name: restostock_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: restostock
      POSTGRES_PASSWORD: restostock
      POSTGRES_DB: restostock
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restostock -d restostock"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: restostock_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  pgdata:
